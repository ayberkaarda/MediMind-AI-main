[project]
name = "medimind-backend"
version = "0.2.0"
description = "MediMind symptom-based disease prediction API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ayberk Arda" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "joblib>=1.4",
    "python-json-logger>=2.0",
]

[project.scripts]
medimind-train = "app.ml.train:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]
train = ["pandas>=2.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Turkish text legitimately uses dotless and dotted i.
allowed-confusables = ["ı", "İ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
"app/ml/train.py" = ["N803", "N806"]
"app/ml/evaluate.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = ["slow: tests that train models on the full dataset"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
